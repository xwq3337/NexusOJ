[service]
AppMode = debug
Port = 8080
Address = http://47.109.57.7

[mysql]
Db = mysql
DbHost = your_mysql_host
DbPort = 3306
DbUser = your_mysql_username
DbPassword = your_mysql_password
DbName = your_mysql_dbname


[redis]
RedisDb = redis
RedisAddr = your_redis_host
RedisPort = 6379
RedisPwd = your_redis_password
RedisDbName = 1

[MongoDB]
MongoDBName = your_mongodb_name
MongoDBUserName = root
MongoDBAddr = your_mongodb_host
MongoDBPwd = your_mongodb_password
MongoDBPort = your_mongodb_port

[path]
DataDir = /var/data/oj/
LogDir = logs/
UploadDir = media/uploads/ ; 用户云， 存放用户上传的文件的目录，上传文件时会将文件存储在该目录下，文件名为用户id/文件id/块id
AvatarDir = media/avatars/ ; 存放用户头像的目录，上传头像时会将头像存储在该目录下，文件名为用户id.png
ChunkDir = media/chunks/ ; 存放文件块的目录，文件上传时会将文件切分成多个块并存储在该目录下，合并后会删除这些块
ImagesDir = media/assets/images/ ; 存放网站的图片资源，如logo等
VideosDir = media/assets/videos/ ; 存放网站的视频资源，如介绍视频等
MarkdownImagesDir = media/assets/markdown/images/ ; 存放markdown中使用的图片资源

[judge]
JudgeServer = your_judge_host
JudgeServerPort = your_judge_port